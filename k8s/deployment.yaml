# Create your deployment here
# test
apiVersion: apps/v1
kind: Deployment 
metadata:
  name: kubernetes-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      project: kubernetes-project
  template:
    metadata:
      labels:
        project: kubernetes-project
    spec: 
      containers:
      - name: kubernetes-pod
        image: nimesh25/flask-app:v1.2-using-cache 
        imagePullPolicy: Always
        ports:
        - containerPort: 31111
        
    